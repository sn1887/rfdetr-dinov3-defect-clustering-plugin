name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.1.3 \
            Pillow==11.1.0 \
            pandas==2.2.3 \
            pyarrow==18.1.0 \
            hydra-core==1.3.2 \
            omegaconf==2.3.0 \
            packaging==24.2 \
            jsonschema==4.23.0 \
            pytest==8.3.4 \
            torch==2.5.1
      - name: Validate repository
        env:
          PYTHONPATH: python-lib
        run: python scripts/validate_plugin.py
      - name: Run tests
        env:
          PYTHONPATH: python-lib
        run: pytest -q
      - name: Build and inspect plugin zip
        run: |
          python scripts/build_plugin_zip.py --output /tmp/plugin.zip
          unzip -t /tmp/plugin.zip
